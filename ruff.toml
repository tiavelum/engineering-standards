# Formatter and linter configuration, required by TL-6 and TL-8.
# Rules are selected deliberately per TL-9; each family carries its reason.

line-length = 100
target-version = "py310"

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = [
  "E",    # pycodestyle errors: the formatter cannot fix all of them
  "W",    # pycodestyle warnings
  "F",    # pyflakes: unused names, undefined names, shadowing
  "I",    # import order, so it is never discussed in review per TL-7
  "N",    # naming, the code side of what standards/naming.md governs elsewhere
  "UP",   # syntax superseded by the target version
  "B",    # bugbear: likely mistakes rather than style
  "SIM",  # constructs with a simpler equivalent
  "PTH",  # pathlib over os.path, since this repository already uses Path
  "RUF",  # ruff's own checks
]
