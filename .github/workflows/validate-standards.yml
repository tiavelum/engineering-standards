name: validate-standards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit of the same pull request cancels the run of the older one
# (TL-34); a push to main gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Check line breaks
        run: python3 scripts/check-line-breaks.py

      - name: Validate standards
        run: python3 scripts/validate-standards.py
