# Authoritative catalogue of standards in this repository.
# Every consumer starts here. Do not discover standards by listing directories.
#
# Contract:
#   - Each entry points to exactly one file covering one topic.
#   - `applies_to` lets a consumer load only what a task needs.
#   - `requires` names the other entries that must be loaded with this one.
#   - `version` follows the rules in meta/rule-format.md.
#   - An entry and its file MUST be updated in the same commit.

schema_version: 1
repository: tiavelum/engineering-standards
updated: 2026-09-06
validated_by: scripts/validate-standards.py

meta:
  - id: rule-format
    path: meta/rule-format.md
    title: Rule file format
    version: 3.0.0
    status: active
    summary: How a standard file is written, how rules are identified and versioned, and the admission test for new rules.
    applies_to: [authoring]
    requires: [consuming, tooling]

  - id: precedence
    path: meta/precedence.md
    title: Precedence and deviation
    version: 1.0.0
    status: active
    summary: How conflicts between these standards, a consuming repo and a task instruction are resolved, and how a deviation is recorded.
    applies_to: [all]

  - id: consuming
    path: meta/consuming.md
    title: Consumer contract
    version: 2.0.0
    status: active
    summary: What a tool, agent or script may rely on when loading these standards, and what it must not assume.
    applies_to: [tooling, agents]
    requires: [naming, precedence, rule-format]

standards:
  - id: naming
    path: standards/naming.md
    title: Naming
    version: 1.3.1
    status: active
    summary: Names for files, directories, branches, tags and repositories.
    applies_to: [all]
    tags: [files, directories, branches, repositories]
    requires: [readme-contract, versioning]

  - id: repo-layout
    path: standards/repo-layout.md
    title: Repository layout
    version: 2.0.0
    status: active
    summary: Required top-level files, directory roles, and what must not live in a repository.
    applies_to: [all]
    tags: [structure, files]
    requires: [documentation, naming, precedence, readme-contract]

  - id: git-workflow
    path: standards/git-workflow.md
    title: Git workflow
    version: 2.1.0
    status: active
    summary: Branching, commit messages, pull requests and history hygiene.
    applies_to: [all]
    tags: [git, commits, branches, review]
    requires: [naming]

  - id: versioning
    path: standards/versioning.md
    title: Versioning
    version: 1.0.1
    status: active
    summary: How a release version is formed, where it is recorded, and when each component is incremented.
    applies_to: [all]
    tags: [versions, releases, semver, dependencies]
    requires: [public-api]

  - id: public-api
    path: standards/public-api.md
    title: Public API
    version: 1.0.1
    status: active
    summary: What a repository publishes as its public API, and which changes to it are breaking.
    applies_to: [all]
    tags: [api, compatibility, releases]
    requires: [versioning]

  - id: readme-contract
    path: standards/readme-contract.md
    title: README contract
    version: 1.0.0
    status: active
    summary: Required sections, ordering and acceptance criteria for the README of any repository.
    applies_to: [all]
    tags: [documentation, readme]

  - id: documentation
    path: standards/documentation.md
    title: Documentation
    version: 2.0.0
    status: active
    summary: "Documentation beyond the README: where it lives, open items, decision records, comments, changelogs."
    applies_to: [all]
    tags: [documentation, adr]
    requires: [naming, precedence, readme-contract, versioning]

  - id: tooling
    path: standards/tooling.md
    title: Tooling and enforcement
    version: 1.1.0
    status: active
    summary: The boundary between what a tool enforces and what a written standard covers, plus the required baseline configuration.
    applies_to: [all]
    tags: [tooling, ci, linting]
    requires: [versioning]

  - id: lifecycle
    path: standards/lifecycle.md
    title: Product lifecycle
    version: 1.0.0
    status: draft
    summary: The phases a product passes through from idea to operation, the artifact each produces, and the gate that must be passed to leave it.
    applies_to: [all]
    tags: [lifecycle, requirements, verification, gates]
    requires: [documentation, git-workflow, readme-contract]
